<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yu-Gi-Oh! Binder Pro - Master Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #090d16; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    .grid-binder { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .card-slot { aspect-ratio: 1 / 1.48; border-radius: 0.5rem; transition: transform 0.15s, border-color 0.15s; }
    .card-slot:active { transform: scale(0.96); }
    .grayscale-card { filter: grayscale(100%) contrast(110%) brightness(0.85); opacity: 0.65; transition: filter 0.3s, opacity 0.3s; }
    .colored-card { filter: none; opacity: 1; transition: filter 0.3s, opacity 0.3s; }
    .card-img { object-fit: contain; width: 100%; height: 100%; border-radius: 4px; }
  </style>
</head>
<body class="pb-24">
  <header class="sticky top-0 z-20 bg-slate-900/95 backdrop-blur border-b border-slate-800 p-3 shadow-lg">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-base font-bold text-amber-500 tracking-wide">YUGIOH! BINDER PRO</h1>
        <p class="text-[10px] text-emerald-400 font-semibold">✓ Oficial CDN • Grises / Color</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openAddCardModal()" class="bg-amber-600 hover:bg-amber-500 text-white text-[10px] font-bold px-2.5 py-1.5 rounded-lg shadow">+ Carta</button>
        <span id="counter" class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-full font-mono font-bold">99 / 99</span>
      </div>
    </div>

    <div class="mt-2 flex gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
      <button id="viewMyCardsBtn" onclick="setViewMode('OWNED')" class="flex-1 py-1.5 text-xs font-bold rounded-md bg-amber-600 text-white transition">Mis Cartas</button>
      <button id="viewAllAlbumBtn" onclick="setViewMode('ALL_ALBUM')" class="flex-1 py-1.5 text-xs font-bold rounded-md text-slate-400 hover:text-white transition">Álbum Completo</button>
    </div>
    
    <div class="mt-2 flex gap-2">
      <input type="text" id="searchInput" placeholder="Buscar por nombre o código..." class="w-full bg-slate-800 text-xs px-3 py-2 rounded-lg text-white border border-slate-700 focus:outline-none focus:border-amber-500">
      <button onclick="resetFilters()" class="bg-amber-600 hover:bg-amber-500 text-xs font-semibold px-3 py-2 rounded-lg text-white whitespace-nowrap">Limpiar</button>
    </div>

    <div class="flex gap-1.5 overflow-x-auto mt-2 text-xs pb-1 scrollbar-none">
      <button onclick="filterType('ALL')" class="bg-amber-500 text-slate-950 font-bold px-3 py-1 rounded-full">Todas</button>
      <button onclick="filterType('Efecto')" class="bg-orange-950 text-orange-400 border border-orange-600/50 px-3 py-1 rounded-full">Efecto 🟠</button>
      <button onclick="filterType('XYZ')" class="bg-slate-800 text-slate-100 border border-slate-600 px-3 py-1 rounded-full">XYZ ⬛</button>
      <button onclick="filterType('Sincronía')" class="bg-slate-200 text-slate-900 border border-slate-300 px-3 py-1 rounded-full font-bold">Sincronía ⚪</button>
      <button onclick="filterType('Fusión')" class="bg-purple-950 text-purple-300 border border-purple-600/50 px-3 py-1 rounded-full">Fusión 🟣</button>
      <button onclick="filterType('Magia')" class="bg-emerald-950 text-emerald-300 border border-emerald-600/50 px-3 py-1 rounded-full">Magia 🟩</button>
      <button onclick="filterType('Trampa')" class="bg-pink-950 text-pink-300 border border-pink-600/50 px-3 py-1 rounded-full">Trampa 🩷</button>
      <button onclick="filterType('Link')" class="bg-blue-950 text-blue-300 border border-blue-600/50 px-3 py-1 rounded-full">Link 🟦</button>
    </div>
  </header>

  <main class="p-3 max-w-md mx-auto">
    <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
      <span id="pageInfo">Página 1 de 11</span>
      <span class="font-mono text-[10px] text-amber-500/80">Carpeta Binder (3x3)</span>
    </div>

    <div id="binderGrid" class="grid-binder"></div>

    <div id="noResults" class="hidden text-center py-12 text-slate-400">
      <p class="text-sm">No se encontraron cartas.</p>
      <button onclick="resetFilters()" class="mt-3 bg-amber-600 text-white text-xs px-4 py-2 rounded-lg font-bold">Ver Colección</button>
    </div>

    <div class="flex justify-between items-center mt-4">
      <button onclick="prevPage()" class="bg-slate-800 border border-slate-700 text-slate-200 px-4 py-2 rounded-lg text-xs font-bold disabled:opacity-40" id="prevBtn">‹ Anterior</button>
      <span id="pageIndicator" class="text-xs text-amber-500 font-mono font-bold">1 / 11</span>
      <button onclick="nextPage()" class="bg-amber-600 text-white px-4 py-2 rounded-lg text-xs font-bold disabled:opacity-40" id="nextBtn">Siguiente ›</button>
    </div>
  </main>

  <!-- Modal Detalle / Gestión -->
  <div id="cardModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur hidden flex items-center justify-center p-4" onclick="closeModal()">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-xs w-full p-4 relative text-center shadow-2xl" onclick="event.stopPropagation()">
      <button onclick="closeModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white text-lg font-bold">✕</button>
      
      <div id="modalCardFrame" class="w-56 h-80 mx-auto rounded-xl border-2 p-1.5 flex flex-col justify-between shadow-2xl relative overflow-hidden bg-slate-950">
        <img id="modalImage" class="w-full h-full object-contain rounded" src="" alt="Carta Yu-Gi-Oh!" onerror="handleModalImageError(this)">
      </div>

      <div class="mt-4 text-left bg-slate-950/60 p-3 rounded-xl border border-slate-800">
        <div class="flex justify-between items-center mb-1">
          <p id="modalName" class="text-xs font-bold text-white"></p>
          <span id="modalCode" class="text-[10px] text-slate-400 font-mono"></span>
        </div>
        <p id="modalStatusTag" class="text-[10px] font-bold mb-1"></p>
        <p class="text-[11px] font-bold text-amber-400 uppercase tracking-wider mb-1">⚡ Estrategia & Combo</p>
        <p id="modalCombo" class="text-xs text-slate-300 leading-relaxed mb-3"></p>

        <div class="flex gap-2">
          <button id="toggleOwnedBtn" onclick="toggleCurrentCardOwnership()" class="flex-1 py-2 text-xs font-bold rounded-lg transition"></button>
          <button onclick="deleteCustomCard()" id="deleteCardBtn" class="hidden bg-red-900/50 hover:bg-red-800 text-red-200 text-xs font-bold px-3 py-2 rounded-lg border border-red-700">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Agregar Nueva Carta -->
  <div id="addCardModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur hidden flex items-center justify-center p-4" onclick="closeAddModal()">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-xs w-full p-4 relative text-left shadow-2xl" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center mb-1">
        <h3 class="text-sm font-bold text-amber-400">Agregar Nueva Carta</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
      </div>
      
      <div class="space-y-3 text-xs">
        <div>
          <label class="text-slate-400 block mb-1">Nombre de la Carta:</label>
          <input type="text" id="newCardName" placeholder="Ej. Dark Magician" class="w-full bg-slate-800 px-3 py-2 rounded-lg text-white border border-slate-700 focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Código (Opcional):</label>
          <input type="text" id="newCardCode" placeholder="Ej. LOB-005" class="w-full bg-slate-800 px-3 py-2 rounded-lg text-white border border-slate-700 focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Tipo:</label>
          <select id="newCardType" class="w-full bg-slate-800 px-3 py-2 rounded-lg text-white border border-slate-700 focus:outline-none focus:border-amber-500">
            <option value="Efecto">Efecto</option>
            <option value="Normal">Normal</option>
            <option value="XYZ">XYZ</option>
            <option value="Sincronía">Sincronía</option>
            <option value="Fusión">Fusión</option>
            <option value="Magia">Magia</option>
            <option value="Trampa">Trampa</option>
            <option value="Link">Link</option>
          </select>
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Estrategia / Combo:</label>
          <textarea id="newCardCombo" placeholder="Escribe el combo o uso..." class="w-full bg-slate-800 px-3 py-2 rounded-lg text-white border border-slate-700 focus:outline-none focus:border-amber-500 h-16 resize-none"></textarea>
        </div>
        <button onclick="saveNewCard()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 rounded-lg transition mt-2">Guardar Carta en la Colección</button>
      </div>
    </div>
  </div>

    const typesList = ["Efecto", "XYZ", "Sincronía", "Fusión", "Magia", "Trampa", "Link"];
    const colorsMap = { "Efecto": "#ea580c", "XYZ": "#334155", "Sincronía": "#e2e8f0", "Fusión": "#a855f7", "Magia": "#059669", "Trampa": "#db2777", "Link": "#2563eb", "Normal": "#ca8a04" };

    const sampleCardIds = [
      "46986414", "89631139", "4064256", "74677422", "70781052", "55144522", "83764718", 
      "38699889", "79855792", "44508094", "24094258", "14558127", "81843628", "63845230",
      "53129443", "41587307", "82593775", "73642296", "32491822", "68540058", "52626105"
    ];

    let ALL_CARDS = [];
    
    function initApp() {
      const savedCustom = localStorage.getItem('yugioh_custom_cards');
      const customCards = savedCustom ? JSON.parse(savedCustom) : [];

      const savedStatus = localStorage.getItem('yugioh_card_status');
      const statusMap = savedStatus ? JSON.parse(savedStatus) : {};

      ALL_CARDS = INITIAL_CARDS.map(c => ({
        ...c,
        owned: statusMap[c.id] !== undefined ? statusMap[c.id] : c.owned
      }));

      customCards.forEach(cc => {
        if (!ALL_CARDS.some(x => x.id === cc.id)) {
          ALL_CARDS.push(cc);
        }
      });

      for (let i = 100; i <= 14200; i++) {
        const type = typesList[i % typesList.length];
        const cardId = `YGO-${String(i).padStart(5, '0')}`;
        const uniqueYgoId = sampleCardIds[i % sampleCardIds.length];
        
        if (!ALL_CARDS.some(x => x.id === cardId)) {
          ALL_CARDS.push({
            id: cardId,
            ygoId: uniqueYgoId,
            name: `Carta Yu-Gi-Oh! #${i}`,
            code: `TCG-${String(i).padStart(4, '0')}`,
            type: type,
            color: colorsMap[type] || "#334155",
            owned: statusMap[cardId] !== undefined ? statusMap[cardId] : false,
            combo: "Espacio reservado en el álbum TCG global.",
            isCustom: false
          });
        }
      }
    }

    let viewMode = 'OWNED';
    let currentType = 'ALL';
    let searchQuery = '';
    let currentPage = 1;
    const PAGE_SIZE = 9;
    let selectedModalCard = null;

    function setViewMode(mode) {
      viewMode = mode;
      currentPage = 1;
      document.getElementById('viewMyCardsBtn').className = mode === 'OWNED' ? "flex-1 py-1.5 text-xs font-bold rounded-md bg-amber-600 text-white transition" : "flex-1 py-1.5 text-xs font-bold rounded-md text-slate-400 hover:text-white transition";
      document.getElementById('viewAllAlbumBtn').className = mode === 'ALL_ALBUM' ? "flex-1 py-1.5 text-xs font-bold rounded-md bg-amber-600 text-white transition" : "flex-1 py-1.5 text-xs font-bold rounded-md text-slate-400 hover:text-white transition";
      render();
    }

    function normalizeStr(str) {
      return (str || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    }

    function getFilteredCards() {
      return ALL_CARDS.filter(c => {
        if (viewMode === 'OWNED' && !c.owned) return false;
        const matchesType = currentType === 'ALL' || normalizeStr(c.type) === normalizeStr(currentType);
        const matchesSearch = !searchQuery || normalizeStr(c.name).includes(normalizeStr(searchQuery)) || normalizeStr(c.code).includes(normalizeStr(searchQuery));
        return matchesType && matchesSearch;
      });
    }

    function render() {
      let filtered = getFilteredCards();
      
      if (filtered.length === 0 && currentType !== 'ALL') {
        currentType = 'ALL';
        filtered = getFilteredCards();
      }

      const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const grid = document.getElementById('binderGrid');
      const noRes = document.getElementById('noResults');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.classList.add('hidden');
        noRes.classList.remove('hidden');
      } else {
        grid.classList.remove('hidden');
        noRes.classList.add('hidden');

        const start = (currentPage - 1) * PAGE_SIZE;
        const pageCards = filtered.slice(start, start + PAGE_SIZE);

        pageCards.forEach(card => {
          const cardEl = document.createElement('div');
          
          const rawId = String(card.ygoId || "46986414");
          const cleanId = rawId.length < 8 ? rawId.padStart(8, '0') : rawId;
          const imgSrc = `https://images.ygoprodeck.com/images/cards/${cleanId}.jpg`;
          
          const imgClass = card.owned ? "card-img colored-card" : "card-img grayscale-card";

          cardEl.className = "card-slot p-1.5 flex flex-col justify-between border-2 bg-slate-900 shadow-xl relative overflow-hidden cursor-pointer";
          cardEl.style.borderColor = card.color;
          cardEl.onclick = () => openModal(card);

          cardEl.innerHTML = `
            <div class="flex justify-between items-center text-[9px] font-mono mb-1">
              <span class="font-bold px-1 py-0.2 rounded" style="background:${card.color}25; color:${card.color}">${card.type}</span>
              <span class="${card.owned ? 'text-slate-400' : 'text-amber-500 font-bold'}">${card.owned ? card.id : 'FALTANTE'}</span>
            </div>
            
            <div class="my-auto h-36 flex items-center justify-center overflow-hidden bg-slate-950 rounded relative">
              <img class="${imgClass}" src="${imgSrc}" alt="${card.name}" data-cardname="${card.name}" data-ygoid="${cleanId}" data-attempt="0" onerror="handleImageError(this)" loading="lazy">
            </div>

            <div class="mt-1 text-center">
              <p class="text-[10px] font-bold text-slate-100 line-clamp-1 leading-tight">${card.name}</p>
              <p class="text-[8px] text-slate-400 font-mono">${card.code || card.id}</p>
            </div>
          `;

          grid.appendChild(cardEl);
        });
      }

      const totalOwnedCount = ALL_CARDS.filter(c => c.owned).length;
      document.getElementById('counter').innerText = `${totalOwnedCount} / ${viewMode === 'OWNED' ? totalOwnedCount : ALL_CARDS.length}`;
      document.getElementById('pageInfo').innerText = `Página ${currentPage} de ${totalPages}`;
      document.getElementById('pageIndicator').innerText = `${currentPage} / ${totalPages}`;
      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = currentPage === totalPages;
    }

    function handleImageError(img) {
      const attempts = parseInt(img.dataset.attempt || '0');
      const ygoId = img.dataset.ygoid;
      const cardName = img.dataset.cardname || "Yu-Gi-Oh!";

      if (attempts === 0) {
        img.dataset.attempt = '1';
        // Intento 2: Red CDN pequeña oficial
        img.src = `https://images.ygoprodeck.com/images/cards_small/${ygoId}.jpg`;
      } else if (attempts === 1) {
        img.dataset.attempt = '2';
        // Intento 3: Búsqueda oficial por nombre exacto en inglés
        const baseName = cardName.split(' #')[0];
        img.src = `https://images.ygoprodeck.com/images/cards/${encodeURIComponent(baseName)}.jpg`;
      } else {
        const parent = img.parentElement;
        parent.innerHTML = `
          <div class="w-full h-full flex flex-col items-center justify-center p-2 text-center bg-slate-900 border border-slate-800 rounded">
            <span class="text-[9px] font-mono text-amber-500 font-bold mb-1">YU-GI-OH!</span>
            <p class="text-[10px] font-bold text-slate-200 line-clamp-3">${cardName}</p>
          </div>
        `;
      }
    }

    function handleModalImageError(img) {
      const ygoId = img.dataset.ygoid;
      const cardName = img.dataset.cardname || "Yu-Gi-Oh!";
      if (!img.src.includes('cards_small')) {
        img.src = `https://images.ygoprodeck.com/images/cards_small/${ygoId}.jpg`;
      } else {
        const baseName = cardName.split(' #')[0];
        img.src = `https://images.ygoprodeck.com/images/cards/${encodeURIComponent(baseName)}.jpg`;
      }
    }

    function openModal(card) {
      selectedModalCard = card;
      const modal = document.getElementById('cardModal');
      const frame = document.getElementById('modalCardFrame');
      const modalImg = document.getElementById('modalImage');
      
      frame.style.borderColor = card.color;
      const rawId = String(card.ygoId || '46986414');
      const cleanId = rawId.length < 8 ? rawId.padStart(8, '0') : rawId;
      
      modalImg.src = `https://images.ygoprodeck.com/images/cards/${cleanId}.jpg`;
      modalImg.dataset.ygoid = cleanId;
      modalImg.dataset.cardname = card.name;
      modalImg.dataset.attempt = '0';
      
      document.getElementById('modalCode').innerText = card.code || card.id;
      document.getElementById('modalName').innerText = card.name;
      document.getElementById('modalCombo').innerText = card.combo;
      
      const statusTag = document.getElementById('modalStatusTag');
      const toggleBtn = document.getElementById('toggleOwnedBtn');
      const deleteBtn = document.getElementById('deleteCardBtn');

      if (card.owned) {
        statusTag.className = "text-[10px] font-bold text-emerald-400 uppercase tracking-wider mb-1";
        statusTag.innerText = "✓ OBTENIDA EN TU COLECCIÓN (A COLOR)";
        toggleBtn.className = "flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 text-xs font-bold rounded-lg border border-slate-600 transition";
        toggleBtn.innerText = "Marcar como Faltante (Grises)";
      } else {
        statusTag.className = "text-[10px] font-bold text-amber-500 uppercase tracking-wider mb-1";
        statusTag.innerText = "✗ CARTA FALTANTE (EN ESCALA DE GRISES)";
        toggleBtn.className = "flex-1 bg-emerald-700 hover:bg-emerald-600 text-white py-2 text-xs font-bold transition";
        toggleBtn.innerText = "✓ Marcar como Obtenida (Color)";
      }

      if (card.isCustom) {
        deleteBtn.classList.remove('hidden');
      } else {
        deleteBtn.classList.add('hidden');
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('cardModal').classList.add('hidden');
      selectedModalCard = null;
    }

    function toggleCurrentCardOwnership() {
      if (!selectedModalCard) return;
      selectedModalCard.owned = !selectedModalCard.owned;

      const statusMap = {};
      ALL_CARDS.forEach(c => { statusMap[c.id] = c.owned; });
      localStorage.setItem('yugioh_card_status', JSON.stringify(statusMap));

      closeModal();
      render();
    }

    function openAddCardModal() {
      document.getElementById('addCardModal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('addCardModal').classList.add('hidden');
    }

    function saveNewCard() {
      const name = document.getElementById('newCardName').value.trim();
      const code = document.getElementById('newCardCode').value.trim() || "CUSTOM-01";
      const type = document.getElementById('newCardType').value;
      const combo = document.getElementById('newCardCombo').value.trim() || "Carta personalizada añadida a la colección.";

      if (!name) {
        alert("Por favor ingresa al menos el nombre de la carta.");
        return;
      }

      const newCard = {
        id: `CUSTOM-${Date.now()}`,
        ygoId: "46986414",
        name: name,
        code: code,
        type: type,
        color: colorsMap[type] || "#334155",
        owned: true,
        combo: combo,
        isCustom: true
      };

      ALL_CARDS.unshift(newCard);

      const customCards = ALL_CARDS.filter(c => c.isCustom);
      localStorage.setItem('yugioh_custom_cards', JSON.stringify(customCards));

      const statusMap = {};
      ALL_CARDS.forEach(c => { statusMap[c.id] = c.owned; });
      localStorage.setItem('yugioh_card_status', JSON.stringify(statusMap));

      closeAddModal();
      document.getElementById('newCardName').value = "";
      document.getElementById('newCardCode').value = "";
      document.getElementById('newCardCombo').value = "";
      render();
    }

    function deleteCustomCard() {
      if (!selectedModalCard || !selectedModalCard.isCustom) return;
      if (confirm(`¿Estás segura de eliminar la carta "${selectedModalCard.name}"?`)) {
        ALL_CARDS = ALL_CARDS.filter(c => c.id !== selectedModalCard.id);
        const customCards = ALL_CARDS.filter(c => c.isCustom);
        localStorage.setItem('yugioh_custom_cards', JSON.stringify(customCards));
        closeModal();
        render();
      }
    }

    function filterType(type) {
      currentType = type;
      currentPage = 1;
      render();
    }

    function resetFilters() {
      currentType = 'ALL';
      searchQuery = '';
      document.getElementById('searchInput').value = "";
      currentPage = 1;
      render();
    }

    function prevPage() { if (currentPage > 1) { currentPage--; render(); } }
    function nextPage() { const total = Math.ceil(getFilteredCards().length / PAGE_SIZE); if (currentPage < total) { currentPage++; render(); } }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      currentPage = 1;
      render();
    });

    initApp();
    render();
  </script>
</body>
</html>
